# fly.io 完整版部署設定——alert_monitor + supercronic + 每日自動更新

app = "twstock-reversal-alert"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# 設定環境變數（非敏感資料）
[env]
  # 每日排程時間（僅供參考，實際在 crontab 裡設定）
  DAILY_UPDATE_HOUR = "7"
  DAILY_UPDATE_MINUTE = "30"
  TZ = "Asia/Taipei"

# 敏感資料用 fly secrets 設定：
#   fly secrets set TELEGRAM_BOT_TOKEN=...
#   fly secrets set TELEGRAM_CHAT_ID=...
