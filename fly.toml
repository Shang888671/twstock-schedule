# fly.io 部署設定——只跑 alert_monitor.py 這支背景推播腳本,沒有對外服務(不開任何port),
# 所以特地不寫 [http_service]/[[services]],這樣 fly.io 才不會誤判「沒有流量就自動關機」
# (那個省電機制只套用在有對外服務的App上)。app名稱在fly.io是全域唯一,如果部署時
# 顯示名稱被佔用,把下面這行的名稱換一個再試就好。
app = "twstock-reversal-alert"
primary_region = "nrt"

[build]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
