name: Fly.io Start/Stop

on:
  schedule:
    # 開機：台北 08:25 → UTC 00:25（週一～週五）
    - cron: "25 0 * * 1-5"
    # 關機：台北 14:05 → UTC 06:05（週一～週五）
    - cron: "5 6 * * 1-5"

jobs:
  fly-control:
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Determine action
        id: action
        run: |
          # cron 觸發，判斷現在是 00:25（開機）還是 06:05（關機）
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$HOUR" = "00" ] && [ "$MIN" = "25" ]; then
            echo "action=start" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ] && [ "$MIN" = "05" ]; then
            echo "action=stop" >> $GITHUB_OUTPUT
          else
            echo "action=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Start machines
        if: steps.action.outputs.action == 'start'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== 啟動 twstock-reversal-alert ==="
          flyctl -a twstock-reversal-alert machines start --timeout 60s || echo "已經開機中"

      - name: Stop machines
        if: steps.action.outputs.action == 'stop'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== 關閉 twstock-reversal-alert ==="
          flyctl -a twstock-reversal-alert machines stop --timeout 60s || echo "已經關機中"
